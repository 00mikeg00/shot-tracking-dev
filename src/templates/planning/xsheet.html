{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto p-4" id="xsheet-root" data-individual-assignment-id="{{ individual_assignment_id }}">

  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-semibold text-white">
      X-Sheet — <span id="xsheet-assignment-name" class="text-yellow-400">…</span>
    </h2>
    <div class="flex gap-2">
      <button id="xsheet-save-btn" type="button"
              class="bg-blue-700 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">
        Save
      </button>
      <button id="xsheet-share-btn" type="button"
              class="bg-green-700 hover:bg-green-600 text-white px-4 py-2 rounded-lg">
        Share for Feedback
      </button>
    </div>
  </div>

  <div id="xsheet-add-column-bar" class="flex items-center gap-2 mb-3 text-sm"></div>

  <div class="overflow-x-auto border border-gray-700 rounded-lg">
    <table id="xsheet-table" class="min-w-full text-sm text-gray-200 border-collapse">
      <thead id="xsheet-thead" class="bg-gray-800"></thead>
      <tbody id="xsheet-tbody"></tbody>
    </table>
  </div>

  <div class="flex items-center gap-2 mt-3 text-sm">
    <input id="xsheet-add-frames-count" type="number" min="1" value="24"
           class="bg-gray-700 text-white rounded px-2 py-1 w-20" />
    <button id="xsheet-add-frames-btn" type="button"
            class="bg-gray-600 hover:bg-gray-500 text-white px-3 py-1 rounded">
      + Add Frames at End
    </button>
  </div>

</div>

<!-- External Libraries -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>

<!-- Page-Specific Scripts -->
<script src="{{ url_for('static', filename='js/xsheet.js') }}" defer></script>

{% endblock %}
